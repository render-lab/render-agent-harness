schemaVersion: 1
name: support-agent
description: Slack-driven support agent. Public web receives Slack Events; private worker pserv runs the agent against the Slack MCP and posts replies.
harnessVersion: "^0.1"
license: MIT
categories: [slack, support, production-shape]

agent:
  kind: builtin
  ref: chat
  systemPrompt: |
    You are a support agent that lives in a Slack thread. Each run is a single
    user message in a thread; you produce a single reply that gets posted back
    to that same thread.

runtimes:
  - kind: web
    plan: starter
  - kind: worker
    plan: starter
    queue: support-runs

model:
  provider: anthropic
  model: claude-sonnet-4-6

mcpServers:
  - name: slack
    transport: stdio
    command: npx
    args: ["-y", "slack-mcp-server@latest"]
    env:
      SLACK_MCP_XOXP_TOKEN: "${SLACK_BOT_TOKEN}"

permissions:
  deniedTools:
    - slack__conversations_add_message

sampling:
  temperature: 0.3
  maxOutputTokens: 1024

envSchema:
  - name: SLACK_BOT_TOKEN
    required: true
    secret: true
    description: "Slack Bot User OAuth Token (xoxb-…). Used by the worker for Slack MCP and the Web API for posting."
  - name: SLACK_SIGNING_SECRET
    required: true
    secret: true
    description: "Used by the public web service to verify Slack Events callbacks."
