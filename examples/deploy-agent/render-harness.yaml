schemaVersion: 1
name: deploy-agent
description: Workflows-driven agent that deploys a GitHub repo to Render via the Render MCP. Every destructive call pauses for human approval.
harnessVersion: "^0.5"
license: MIT
categories: [workflows, render-mcp, hitl]

shared:
  model:
    provider: anthropic
    model: claude-sonnet-4-6
  permissions:
    # Mirrors RENDER_MCP_MUTATING_TOOLS from @render-harness/cap-render.
    # Names are the fully-namespaced exposed form (cap_render__render__<tool>)
    # the harness sees at runtime — see cap-render/README.md for the derivation.
    requireApproval:
      - cap_render__render__create_web_service
      - cap_render__render__update_web_service
      - cap_render__render__delete_service
      - cap_render__render__create_postgres
      - cap_render__render__update_postgres
      - cap_render__render__delete_postgres
      - cap_render__render__create_keyvalue
      - cap_render__render__update_keyvalue
      - cap_render__render__delete_keyvalue
      - cap_render__render__update_environment_variables
      - cap_render__render__create_environment_variable
      - cap_render__render__delete_environment_variable
  budget:
    maxIterations: 60
    maxCostUsd: 5
    maxWallSeconds: 1800
  sampling:
    temperature: 0.2
    maxOutputTokens: 4096

capabilities:
  - pack: "@render-harness/cap-render"

envSchema:
  - name: RENDER_API_KEY
    required: true
    secret: true
    description: "Render workspace API key. Required for cap-render's MCP wiring and for the Workflows SDK to trigger tasks."

agents:
  - id: deploy-agent
    workflowTask: true
    agent:
      kind: builtin
      ref: chat
      systemPrompt: |
        You are the Render deploy agent. The user gives you a GitHub repository URL
        (and optionally a service name and other params); you produce a running
        Render web service or a clear failure with a documented next step.

        Use the cap-render skills (`render-overview`, `render-deploy-flow`,
        `render-logs-and-debug`) for orientation before touching any tools.
    runtimes:
      - kind: workflows
        plan: starter
