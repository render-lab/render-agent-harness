schemaVersion: 1
name: deploy-agent
description: Workflows-driven agent that deploys a GitHub repo to Render via the Render MCP. Every destructive call pauses for human approval.
harnessVersion: "^0.1"
license: MIT
categories: [workflows, render-mcp, hitl]

agent:
  kind: builtin
  ref: chat
  systemPrompt: |
    You are the Render deploy agent. The user gives you a GitHub repository URL
    (and optionally a service name and other params); you produce a running
    Render web service or a clear failure with a documented next step.

# Workflows aren't yet supported in render.yaml Blueprints. The
# emitter will record a Dashboard checklist; deploy the workflow service
# from the Render Dashboard following examples/deploy-agent/README.md.
runtimes:
  - kind: workflows
    plan: starter

model:
  provider: anthropic
  model: claude-sonnet-4-6

mcpServers:
  - name: render
    transport: http
    url: https://mcp.render.com/mcp
    headers:
      Authorization: "Bearer ${RENDER_API_KEY}"

permissions:
  requireApproval:
    - render__create_web_service
    - render__update_web_service
    - render__delete_service
    - render__create_postgres
    - render__update_postgres
    - render__delete_postgres
    - render__create_keyvalue
    - render__update_keyvalue
    - render__delete_keyvalue
    - render__update_environment_variables
    - render__create_environment_variable
    - render__delete_environment_variable

budget:
  maxIterations: 60
  maxCostUsd: 5
  maxWallSeconds: 1800

sampling:
  temperature: 0.2
  maxOutputTokens: 4096

envSchema:
  - name: RENDER_API_KEY
    required: true
    secret: true
    description: "Render workspace API key. Required for the Render MCP and for the Workflows SDK to trigger tasks."
