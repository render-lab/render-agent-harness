schemaVersion: 1
capabilities:
  - package: "@render-harness/cap-webhook-generic"
    name: Generic webhook
    description: HMAC-verified inbound webhook connector for custom event sources.
    categories: [connector, webhook]
    provider: Generic
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-webhook-generic
    license: MIT
    maintainer: render-harness
    versionRange: "^0.2"
    requiresHarness: "^0.2"
    features: [connectors]
    envVars:
      - name: WEBHOOK_SECRET
        required: false
        secret: true
        description: Secret used to verify generic webhook HMAC signatures.
    permissions:
      accessMode: read
      network: false
      filesystem: none
      sidecarServices: false
    connectors:
      - key: webhook-generic
        auth: hmac
        description: Generic HMAC webhook receiver.
    quality:
      testCommand: pnpm --filter @render-harness/cap-webhook-generic test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official

  - package: "@render-harness/cap-github"
    name: GitHub
    description: GitHub work-monitoring connector with webhook ingestion and SDK-backed tools.
    categories: [connector, github, work]
    provider: GitHub
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-github
    license: MIT
    maintainer: render-harness
    versionRange: "^0.2"
    requiresHarness: "^0.2"
    features: [tools, connectors]
    envVars:
      - name: GITHUB_WEBHOOK_SECRET
        required: true
        secret: true
        description: Secret used to verify GitHub webhook signatures.
      - name: GITHUB_TOKEN
        required: true
        secret: true
        description: GitHub token used for read tools and optional write tools.
    permissions:
      accessMode: mixed
      network: true
      filesystem: none
      sidecarServices: false
      notes: Defaults to read mode; mutation tools require accessMode read_write.
    connectors:
      - key: github
        auth: hmac
        eventTypes:
          - issues
          - issue_comment
          - pull_request
          - pull_request_review
          - pull_request_review_comment
          - check_run
          - workflow_run
    quality:
      testCommand: pnpm --filter @render-harness/cap-github test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official

  - package: "@render-harness/cap-linear"
    name: Linear
    description: Linear work-monitoring connector with webhook ingestion and SDK-backed tools.
    categories: [connector, linear, work]
    provider: Linear
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-linear
    license: MIT
    maintainer: render-harness
    versionRange: "^0.2"
    requiresHarness: "^0.2"
    features: [tools, connectors]
    envVars:
      - name: LINEAR_WEBHOOK_SECRET
        required: true
        secret: true
        description: Secret used to verify Linear webhook signatures.
      - name: LINEAR_API_KEY
        required: true
        secret: true
        description: Linear API key used for read tools and optional write tools.
    permissions:
      accessMode: mixed
      network: true
      filesystem: none
      sidecarServices: false
      notes: Defaults to read mode; mutation tools require accessMode read_write.
    connectors:
      - key: linear
        auth: hmac
        eventTypes:
          - Issue
          - Comment
          - Project
          - Cycle
    quality:
      testCommand: pnpm --filter @render-harness/cap-linear test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official

  - package: "@render-harness/cap-slack"
    name: Slack
    description: Slack Events connector with SDK-backed thread reads and opt-in replies.
    categories: [connector, slack, chat]
    provider: Slack
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-slack
    license: MIT
    maintainer: render-harness
    versionRange: "^0.2"
    requiresHarness: "^0.2"
    features: [tools, connectors]
    envVars:
      - name: SLACK_SIGNING_SECRET
        required: true
        secret: true
        description: Slack signing secret used to verify Events API requests.
      - name: SLACK_BOT_TOKEN
        required: true
        secret: true
        description: Slack bot token used for read tools and optional write tools.
    permissions:
      accessMode: mixed
      network: true
      filesystem: none
      sidecarServices: false
      notes: Defaults to read mode; replies and reactions require accessMode read_write.
    connectors:
      - key: slack
        auth: hmac
        eventTypes:
          - url_verification
          - app_mention
          - message
    quality:
      testCommand: pnpm --filter @render-harness/cap-slack test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official

  - package: "@render-harness/cap-render"
    name: Render (deploys + services)
    description: First-party pack wrapping the hosted Render MCP for managing services, deploys, databases, env vars, and logs. Ships 3 skills and a curated mutating-tool list for HITL gating.
    categories: [tools, render, mcp, deploy, infrastructure]
    provider: Render
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-render
    license: MIT
    maintainer: render-harness
    versionRange: "^0.5"
    requiresHarness: "^0.5"
    features: [tools]
    envVars:
      - name: RENDER_API_KEY
        required: true
        secret: true
        description: >-
          Render workspace API key (https://dashboard.render.com/u/settings#api-keys).
          Used as a bearer token to the hosted Render MCP at https://mcp.render.com/mcp.
    permissions:
      accessMode: mixed
      network: true
      filesystem: none
      sidecarServices: false
      notes: >-
        The Render MCP exposes destructive tools (create_*, update_*, delete_*).
        The pack exports RENDER_MCP_MUTATING_TOOLS — paste it into
        permissions.requireApproval to gate mutations behind HITL approval.
    quality:
      testCommand: pnpm --filter @render-harness/cap-render test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official

  - package: "@render-harness/cap-notion"
    name: Notion
    description: Notion pages, databases, and workspace search via per-end-user OAuth. 8 tools across pages, databases, and search; 2 skills. First non-Google validation of the connection API.
    categories: [tools, notion, knowledge, wiki, oauth]
    provider: Notion
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-notion
    license: MIT
    maintainer: render-harness
    versionRange: "^0.6"
    requiresHarness: "^0.6"
    features: [tools]
    envVars:
      - name: NOTION_OAUTH_CLIENT_ID
        required: true
        secret: false
        description: Notion public integration OAuth client id.
      - name: NOTION_OAUTH_CLIENT_SECRET
        required: true
        secret: true
        description: Notion public integration OAuth client secret.
      - name: CONNECTIONS_ENCRYPTION_KEY
        required: true
        secret: true
        description: >-
          32-byte base64 secret used by the harness to encrypt refresh tokens at rest.
          Generate with `openssl rand -base64 32`.
    permissions:
      accessMode: mixed
      network: true
      filesystem: none
      sidecarServices: false
      notes: >-
        Per-end-user OAuth via the harness connection API. Notion issues long-lived access
        tokens with no refresh token (refreshTokenOptional: true is set on the provider
        config). End users also need to share each page/database with the integration via
        Notion's "Add connections" menu.
    quality:
      testCommand: pnpm --filter @render-harness/cap-notion test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official

  - package: "@render-harness/cap-intercom"
    name: Intercom
    description: First dual inbound+outbound pack — HMAC-verified webhook for conversation events plus per-end-user OAuth tools for replying, assigning, tagging, closing, and snoozing.
    categories: [tools, connector, intercom, support, webhook, oauth]
    provider: Intercom
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-intercom
    license: MIT
    maintainer: render-harness
    versionRange: "^0.6"
    requiresHarness: "^0.6"
    features: [tools, connectors]
    envVars:
      - name: INTERCOM_OAUTH_CLIENT_ID
        required: true
        secret: false
        description: Intercom OAuth app client id (from the Developer Hub).
      - name: INTERCOM_OAUTH_CLIENT_SECRET
        required: true
        secret: true
        description: >-
          Intercom OAuth app client secret. Doubles as the HMAC key for webhook
          signature verification (Intercom signs every delivery with this).
      - name: CONNECTIONS_ENCRYPTION_KEY
        required: true
        secret: true
        description: >-
          32-byte base64 secret used by the harness to encrypt refresh tokens at rest.
          Generate with `openssl rand -base64 32`.
    permissions:
      accessMode: mixed
      network: true
      filesystem: none
      sidecarServices: false
      notes: >-
        Per-end-user OAuth via the harness connection API. Workspace-scoped in v1
        (one Intercom workspace per pack instance). Scopes configured server-side
        on the Intercom app; the pack requests no specific scope list at OAuth
        time. Default accessMode is read_write; set to "read" to drop the 5
        write tools.
    connectors:
      - key: intercom
        auth: hmac
        eventTypes:
          - conversation.user.created
          - conversation.user.replied
          - conversation.admin.assigned
          - conversation.admin.closed
    quality:
      testCommand: pnpm --filter @render-harness/cap-intercom test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official

  - package: "@render-harness/cap-google"
    name: Google Workspace
    description: Gmail + Calendar tools backed by the harness's per-end-user OAuth connection API.
    categories: [tools, google, gmail, calendar, workspace]
    provider: Google
    repo: https://github.com/render/render-harness
    docs: https://github.com/render/render-harness/tree/main/packages/capabilities/cap-google
    license: MIT
    maintainer: render-harness
    versionRange: "^0.5"
    requiresHarness: "^0.5"
    features: [tools]
    envVars:
      - name: GOOGLE_OAUTH_CLIENT_ID
        required: true
        secret: false
        description: Google Cloud OAuth 2.0 client id (Web application credentials).
      - name: GOOGLE_OAUTH_CLIENT_SECRET
        required: true
        secret: true
        description: Google Cloud OAuth 2.0 client secret.
      - name: CONNECTIONS_ENCRYPTION_KEY
        required: true
        secret: true
        description: >-
          32-byte base64 secret used by the harness to encrypt refresh tokens at rest.
          Generate with `openssl rand -base64 32`.
    permissions:
      accessMode: mixed
      network: true
      filesystem: none
      sidecarServices: false
      notes: >-
        Per-end-user OAuth via the harness connection API. Tools call
        secrets.requireConnection("google") at runtime; each end user clicks
        "Connect Google" in the operator UI. Default accessMode is read_write
        (gmail.send, calendar.create_event, etc.); set "read" for read-only.
    quality:
      testCommand: pnpm --filter @render-harness/cap-google test
      smokeTestStatus: passing
      reviewStatus: maintainer-reviewed
    trustTier: official
