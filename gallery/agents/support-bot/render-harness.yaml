schemaVersion: 1
name: support-bot
description: Queue-driven support agent. Web service enqueues; worker processes.
harnessVersion: "^0.2"
license: MIT

shared:
  model:
    provider: anthropic
    model: claude-sonnet-4-6
  permissions:
    allowedTools:
      - cap-slack__slack_get_thread
      - cap-slack__slack_get_channel_history
      - cap-slack__slack_send_message
      - cap-slack__slack_add_reaction
      - cap-slack__slack_update_message
    requireApproval:
      - cap-slack__slack_send_message
      - cap-slack__slack_add_reaction
      - cap-slack__slack_update_message

capabilities:
  - pack: "@render-harness/cap-slack"
    config:
      agent: support-bot
      accessMode: read_write
      signingSecretEnv: SLACK_SIGNING_SECRET
      botTokenEnv: SLACK_BOT_TOKEN

agents:
  - id: support-bot
    agent:
      kind: builtin
      ref: chat
      systemPrompt: |
        You are a first-line support agent. You triage incoming user reports,
        answer common questions clearly, and escalate anything you're not
        confident about by labelling the conversation for a human to pick up.

        Be concise. Quote the user's exact issue when summarizing. Never
        fabricate product details — if you don't know, say so and escalate.
    runtimes:
      - kind: web
        plan: starter
      - kind: worker
        plan: starter
        queue: support-bot-runs
