schemaVersion: 1

# Curated agent templates the CLI (and future UI scaffolder) offer as
# starting points. Capabilities are NOT listed here — they're discovered
# from `packages/capabilities/*` via the `render-harness-cap` keyword.
#
# Adding an entry:
#   1. Create `gallery/agents/<slug>/render-harness.yaml` (must parse
#      against HarnessConfigSchema).
#   2. (Optional) Add `gallery/agents/<slug>/README.md` for the wizard
#      preview.
#   3. Add a row below.
#   4. `pnpm --filter @render-harness/registry test` must still pass —
#      the loader cross-checks that runtimeKinds here matches the
#      manifest's runtimes[].kind.
#
# Taxonomy facets (May 2026 standardization):
#   - surface[]: web-chat, slack, email, calendar, github, linear,
#     webhook, browser, render-mcp, filesystem
#   - audience[]: eng, support, sales, ops, personal, content, growth,
#     hiring
# Both are optional; both are validated against a closed set by
# `GalleryAgentEntrySchema` in `packages/registry/src/gallery.ts`.

agents:
  # ----------------------------------------------------------------
  # Tier 0 — Trivial baselines
  # ----------------------------------------------------------------
  - slug: chat
    name: "Chat assistant"
    description: "Minimal single-turn HTTP chat agent. The simplest starting point."
    path: ./agents/chat
    surface: ["web-chat"]
    audience: ["personal", "eng"]
    runtimeKinds: ["web"]
    requiresHarness: "^0.1"
    capabilities: []
    author: "render-harness"

  - slug: chat-with-memory
    name: "Chat with memory"
    description: "Multi-turn HTTP + worker chat agent with persistent long-term memory."
    path: ./agents/chat-with-memory
    surface: ["web-chat"]
    audience: ["personal", "eng"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: research-cron
    name: "Research cron"
    description: "Scheduled research agent that runs on a cron and uses Exa web search."
    path: ./agents/research-cron
    surface: []
    audience: ["content", "growth"]
    runtimeKinds: ["cron"]
    requiresHarness: "^0.1"
    capabilities:
      - "@render-harness/cap-search-exa"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 1 — Slack-rooted
  # ----------------------------------------------------------------
  - slug: support-bot
    name: "Support bot"
    description: "Slack-driven web + worker support flow with threaded replies."
    path: ./agents/support-bot
    surface: ["slack"]
    audience: ["support"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.1"
    capabilities:
      - "@render-harness/cap-slack"
    author: "render-harness"

  - slug: slack-standup
    name: "Slack standup"
    description: "Mon-Fri cron that posts a 'what shipped yesterday' digest to a Slack channel from memory + linked sources."
    path: ./agents/slack-standup
    surface: ["slack"]
    audience: ["eng", "ops"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-slack"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: slack-pr-notifier
    name: "Slack PR notifier"
    description: "GitHub webhook → opinionated PR summary in a Slack channel. Posts when PRs open, get reviewed, or merge."
    path: ./agents/slack-pr-notifier
    surface: ["slack", "github"]
    audience: ["eng"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-github"
      - "@render-harness/cap-slack"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: slack-question-router
    name: "Slack question router"
    description: "DM/mention router — classifies incoming Slack questions (FAQ / human / escalate) and replies or hands off accordingly."
    path: ./agents/slack-question-router
    surface: ["slack"]
    audience: ["support"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-slack"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 2 — Engineering work
  # ----------------------------------------------------------------
  - slug: work-monitor
    name: "Work monitor"
    description: "GitHub + Linear work monitor that watches PRs, issues, checks, projects, and comments."
    path: ./agents/work-monitor
    surface: ["github", "linear", "webhook"]
    audience: ["eng"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.1"
    capabilities:
      - "@render-harness/cap-github"
      - "@render-harness/cap-linear"
    author: "render-harness"

  - slug: pr-reviewer
    name: "PR reviewer"
    description: "First-pass PR reviewer. Comments are HITL-gated — the agent drafts; you click approve before anything posts."
    path: ./agents/pr-reviewer
    surface: ["github"]
    audience: ["eng"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-github"
    author: "render-harness"

  - slug: issue-triager
    name: "Issue triager"
    description: "Linear webhook → auto-label and route new issues by content. Label adds are HITL-gated."
    path: ./agents/issue-triager
    surface: ["linear"]
    audience: ["eng"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-linear"
    author: "render-harness"

  - slug: dependency-watcher
    name: "Dependency watcher"
    description: "Weekly cron that scans GitHub Dependabot + outdated deps and pings Slack on actionable upgrades."
    path: ./agents/dependency-watcher
    surface: ["github", "slack"]
    audience: ["eng", "ops"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-github"
      - "@render-harness/cap-slack"
    author: "render-harness"

  - slug: release-notes-cron
    name: "Release notes cron"
    description: "Weekly cron that drafts release notes from merged GitHub PRs in the last 7 days."
    path: ./agents/release-notes-cron
    surface: ["github"]
    audience: ["eng"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-github"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 3 — Email + calendar
  # ----------------------------------------------------------------
  - slug: gmail-triage
    name: "Gmail triage"
    description: "Per-user Gmail triage. Labels incoming mail and suggests follow-ups. Per-end-user OAuth via the harness connections API."
    path: ./agents/gmail-triage
    surface: ["email"]
    audience: ["personal", "ops"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.5"
    capabilities:
      - "@render-harness/cap-google"
    author: "render-harness"

  - slug: inbox-digest-cron
    name: "Inbox digest cron"
    description: "Daily 8am cron that emails a morning 'what matters today' briefing pulled from Gmail + Calendar."
    path: ./agents/inbox-digest-cron
    surface: ["email", "calendar"]
    audience: ["personal", "ops"]
    runtimeKinds: ["cron", "web", "worker"]
    requiresHarness: "^0.5"
    capabilities:
      - "@render-harness/cap-google"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: meeting-prepper
    name: "Meeting prepper"
    description: "Cron every 15 min — drops a 1-pager into memory for any meeting starting within the next hour."
    path: ./agents/meeting-prepper
    surface: ["calendar"]
    audience: ["personal", "hiring"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.5"
    capabilities:
      - "@render-harness/cap-google"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 4 — Research + content
  # ----------------------------------------------------------------
  - slug: news-digest
    name: "News digest"
    description: "Daily cron that produces a topic-scoped news roundup with deduping against memory."
    path: ./agents/news-digest
    surface: []
    audience: ["content", "growth"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-search-tavily"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: rss-watcher
    name: "RSS watcher"
    description: "Cron that polls a list of RSS/Atom feeds, summarizes new items, and posts notable ones to Slack."
    path: ./agents/rss-watcher
    surface: ["slack"]
    audience: ["content", "growth"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-scrape-firecrawl"
      - "@render-harness/cap-slack"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: competitive-intel
    name: "Competitive intel"
    description: "Weekly cron — scrapes competitor URLs, diffs against last week, and writes a memo into memory."
    path: ./agents/competitive-intel
    surface: []
    audience: ["growth", "content"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-scrape-firecrawl"
      - "@render-harness/cap-search-exa"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: topic-deep-dive
    name: "Topic deep dive"
    description: "Workflows-mode research agent. Takes a topic, drafts an outline (HITL), then produces a multi-section report grounded in scraped sources."
    path: ./agents/topic-deep-dive
    surface: []
    audience: ["content", "growth", "eng"]
    runtimeKinds: ["workflows"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-search-exa"
      - "@render-harness/cap-scrape-firecrawl"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 5 — Site + browser
  # ----------------------------------------------------------------
  - slug: site-uptime
    name: "Site uptime"
    description: "Cron that checks a list of URLs and pings Slack on regression. Each ping includes a probable-cause hint, not just 'site down'."
    path: ./agents/site-uptime
    surface: ["slack"]
    audience: ["eng", "ops"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-slack"
    author: "render-harness"

  - slug: changelog-watcher
    name: "Changelog watcher"
    description: "Weekly cron — scrapes vendor changelog pages, diffs against last week's snapshot, and writes a 'what's new' memo."
    path: ./agents/changelog-watcher
    surface: []
    audience: ["eng", "ops"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-scrape-firecrawl"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: browser-scout
    name: "Browser scout"
    description: "Web-research agent that uses a real headless browser (Browserbase) so it can read JS-heavy, Cloudflare-protected, or login-walled sites."
    path: ./agents/browser-scout
    surface: ["browser"]
    audience: ["eng", "content", "growth"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-browser-browserbase"
      - "@render-harness/cap-search-exa"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  - slug: form-filler
    name: "Form filler"
    description: "Workflows-mode agent that completes a multi-step web form using Browserbase. HITL approval before the final submit."
    path: ./agents/form-filler
    surface: ["browser"]
    audience: ["ops", "personal"]
    runtimeKinds: ["workflows"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-browser-browserbase"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 6 — Webhooks + integrations
  # ----------------------------------------------------------------
  - slug: webhook-router
    name: "Webhook router"
    description: "Generic HMAC-verified webhook → classify → fan out to Slack notify or Linear ticket."
    path: ./agents/webhook-router
    surface: ["webhook", "slack", "linear"]
    audience: ["eng", "ops"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-webhook-generic"
      - "@render-harness/cap-slack"
      - "@render-harness/cap-linear"
    author: "render-harness"

  - slug: calendly-prep
    name: "Calendly prep"
    description: "Calendly webhook → calendar + memory lookup → 1-pager about the attendee posted to Slack."
    path: ./agents/calendly-prep
    surface: ["webhook", "calendar", "email", "slack"]
    audience: ["sales", "hiring"]
    runtimeKinds: ["web", "worker"]
    requiresHarness: "^0.5"
    capabilities:
      - "@render-harness/cap-webhook-generic"
      - "@render-harness/cap-google"
      - "@render-harness/cap-slack"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 7 — Ops + Render
  # ----------------------------------------------------------------
  - slug: deploy-agent
    name: "Deploy agent"
    description: "Workflows-driven agent that deploys a GitHub repo to Render via Render MCP. Every destructive call pauses for human approval."
    path: ./agents/deploy-agent
    surface: ["render-mcp", "github"]
    audience: ["eng", "ops"]
    runtimeKinds: ["workflows"]
    requiresHarness: "^0.2"
    capabilities: []
    author: "render-harness"

  - slug: cost-watcher
    name: "Cost watcher"
    description: "Cron that polls Render's MCP server for service usage and pings Slack on threshold breach."
    path: ./agents/cost-watcher
    surface: ["render-mcp", "slack"]
    audience: ["ops"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-slack"
    author: "render-harness"

  - slug: etl-cron
    name: "ETL cron"
    description: "Cron that pulls a public dataset (HTTP), snapshots it to a Render disk via cap-filesystem, and writes normalized rows to memory."
    path: ./agents/etl-cron
    surface: ["filesystem"]
    audience: ["eng", "ops"]
    runtimeKinds: ["cron", "web"]
    requiresHarness: "^0.2"
    capabilities:
      - "@render-harness/cap-filesystem"
      - "@render-harness/cap-memory-pg"
    author: "render-harness"

  # ----------------------------------------------------------------
  # Tier 8 — Compounding bundles
  # ----------------------------------------------------------------
  - slug: chief-of-staff
    name: "Chief of Staff"
    description: "Sealed bundle — chat, meeting prep, weekly recap, interview prep + feedback. Cron for cheap checks; Workflows for durable runs."
    path: ./agents/chief-of-staff
    surface: ["web-chat", "calendar"]
    audience: ["personal", "hiring"]
    runtimeKinds: ["web", "worker", "cron", "workflows"]
    requiresHarness: "^0.1"
    capabilities:
      - "@render-harness/cap-memory-pg"
    author: "render-harness"
