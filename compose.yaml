name: render-harness

# Local-only stack for harness development. Mirrors the production primitives:
#   postgres -> Render Managed Postgres (matches the render.demo.yaml version)
#   valkey   -> Render Key Value (Redis-compatible Valkey 8)
#
# Both services bind to 127.0.0.1 only so they don't conflict with anything
# else listening on your LAN. If your host already runs Postgres or Redis on
# the default ports, override the host port via env, e.g.:
#   HARNESS_PG_PORT=55432 HARNESS_KV_PORT=56379 docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: render-harness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "127.0.0.1:${HARNESS_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: render-harness-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${HARNESS_KV_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  pgdata:
