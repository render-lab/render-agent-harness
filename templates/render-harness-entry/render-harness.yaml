schemaVersion: 1
name: my-agent
description: Replace this with a one-line description of your agent.
harnessVersion: "^0.1"
license: MIT

# Bundle-wide defaults applied to every agent unless overridden.
shared:
  model:
    provider: anthropic
    model: claude-sonnet-4-6
  # ui: true   # uncomment to mount the operator UI at /ui (web service only)

# Capability packs contribute tools, MCP servers, and skills shared by
# every agent. Add them here, then `pnpm add <pkg>`.
# capabilities:
#   - pack: "@render-harness/cap-search-exa"

# Env vars beyond the model API key.
# envSchema:
#   - name: SOME_API_KEY
#     required: true
#     secret: true

agents:
  # Each entry is one agent. A bundle declares N agents that share one
  # Render deployment (pg + KV + coalesced web + worker + N cron services).
  # A "single-agent" project is just one entry here.
  - id: my-agent
    # kind: builtin uses the chat builtin (system prompt + model + MCP,
    # no local tools). Switch to kind: custom + entrypoint: ./agent/index.ts
    # if you need TypeScript tool handlers.
    agent:
      kind: builtin
      ref: chat
      systemPrompt: |
        You are a helpful assistant deployed on Render via the agent harness.
        Each request is a single-turn conversation. Be concise.
    # Pick the runtimes this agent exposes:
    #   kind: web       — synchronous HTTP request handler (sub-30s).
    #   kind: cron      — scheduled, single-shot. Add `schedule: "..."`.
    #   kind: worker    — always-on queue consumer; combine with kind: web for multi-tenant.
    #   kind: workflows — long-running, durable, HITL. Not Blueprintable yet.
    runtimes:
      - kind: web
        plan: starter
    # Per-agent MCP servers. Bundle-wide cap-pack-contributed MCP servers
    # land here automatically — these are agent-specific.
    # mcpServers:
    #   - name: render
    #     transport: http
    #     url: https://mcp.render.com/mcp
    #     headers:
    #       Authorization: "Bearer ${RENDER_API_KEY}"
