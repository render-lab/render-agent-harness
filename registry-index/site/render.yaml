# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Static site that hosts the registry's discovery page. Deploys
# `site/` (this directory) plus a copy of `index.json` next to it.

services:
  - type: web
    runtime: static
    name: render-harness-registry
    buildCommand: cp ../index.json index.json
    staticPublishPath: .
    rootDir: site
    routes:
      - type: rewrite
        source: /
        destination: /index.html
