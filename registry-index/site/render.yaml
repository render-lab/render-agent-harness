# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Deprecated static site for old registry deploys. The canonical browse UI
# now lives in the wizard service at `/browse`; this remains as a
# compatibility fallback that can still read `index.json`.

services:
  - type: web
    runtime: static
    name: render-harness-registry
    buildCommand: cp ../index.json index.json
    staticPublishPath: .
    rootDir: site
    routes:
      - type: rewrite
        source: /
        destination: /index.html
